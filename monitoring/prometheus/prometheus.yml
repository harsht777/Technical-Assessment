global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "sre_api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["api:5000"]
        labels:
          environment: "production"
          service: "sre-devops-api"
