groups:
  - name: sre_api_alerts
    rules:
      # Alert 1: Service is down or unreachable
      - alert: APIDown
        expr: up{job="sre_api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API Service is Down"
          description: "The API target {{ $labels.instance }} has been unreachable for more than 30 seconds."

      # Alert 2: High Error Rate (5xx responses)
      - alert: HighErrorRate
        expr: (sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m]))) * 100 > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High API Error Rate (> 5%)"
          description: "More than 5% of requests returned 5xx server errors over the last minute."

      # Alert 3: High Latency (P95 > 500ms)
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High 95th Percentile Latency"
          description: "95% of API requests are taking longer than 500ms to respond."
